apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: mfe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
        - name: users
          image: mfe-users:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
